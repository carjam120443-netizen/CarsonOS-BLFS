name: CarsonOS Full LFS Build

on:
  workflow_dispatch:
    inputs:
      build_lfs:
        description: Build the complete LFS system with jhalfs
        required: true
        default: true
        type: boolean
      install_porg:
        description: Install Porg and the carson-pkg wrapper into the target root
        required: true
        default: true
        type: boolean
      build_iso:
        description: Assemble and upload the CarsonOS ISO
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'build-*'

# A full LFS build needs root, chroot, mounts, loop devices and much more than
# a normal GitHub-hosted runner provides. Configure a dedicated Linux
# self-hosted runner with the label 'carsonos-lfs' before starting this job.
# The build intentionally does NOT run for normal pushes or pull requests.

jobs:
  full-build:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/build-') }}
    runs-on: [self-hosted, Linux, X64, carsonos-lfs]
    timeout-minutes: 720
    permissions:
      contents: read
      actions: write
    env:
      LFS: /mnt/carsonos
      BUILD_DIR: /mnt/carsonos-jhalfs
      LFS_BOOK: 13.0-systemd
      JOBS: 4
    steps:
      - name: Check out CarsonOS
        uses: actions/checkout@v6

      - name: Verify privileged build host
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -eq 0 || {
            echo 'The carsonos-lfs runner must execute this job with root privileges.' >&2
            exit 1
          }
          command -v chroot
          command -v mount
          command -v git
          command -v make
          command -v wget
          df -h /mnt || true

      - name: Install ISO assembly dependencies
        if: ${{ inputs.build_iso || github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y grub-pc-bin grub-common xorriso

      - name: Build complete LFS 13.0-systemd system
        if: ${{ inputs.build_lfs || github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          chmod +x scripts/10-full-lfs-build.sh scripts/11-jhalfs-full-build.sh
          ./scripts/10-full-lfs-build.sh
          ./scripts/11-jhalfs-full-build.sh

      - name: Install Porg package manager
        if: ${{ inputs.install_porg || github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          chmod +x scripts/12-install-porg.sh
          ./scripts/12-install-porg.sh

      - name: Create build manifest
        shell: bash
        run: |
          mkdir -p output
          {
            echo "CarsonOS BLFS build"
            echo "LFS book: ${LFS_BOOK}"
            echo "Architecture: $(uname -m)"
            echo "Kernel: $(uname -r)"
            echo "Commit: ${GITHUB_SHA}"
            echo "Porg: $(chroot "$LFS" /usr/bin/porg --version 2>/dev/null || true)"
          } | tee output/build-manifest.txt

      - name: Check ISO build dependencies
        if: ${{ inputs.build_iso || github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          chmod +x scripts/14-iso-deps-check.sh
          ./scripts/14-iso-deps-check.sh

      - name: Assemble CarsonOS ISO
        if: ${{ inputs.build_iso || github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          chmod +x scripts/13-make-iso.sh
          ./scripts/13-make-iso.sh
          test -s output/carsonos-blfs-x86_64.iso
          test -s output/carsonos-blfs-x86_64.iso.sha256
          file output/carsonos-blfs-x86_64.iso

      - name: Archive LFS build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: carsonos-lfs-logs-${{ github.run_number }}
          path: |
            /mnt/carsonos-jhalfs/**/logs/**
            /mnt/carsonos-jhalfs/**/*.log
            output/build-manifest.txt
          if-no-files-found: warn

      - name: Archive target filesystem
        if: success()
        shell: bash
        run: |
          tar --numeric-owner --xattrs --acls -C "$LFS" -czf output/carsonos-lfs-rootfs.tar.gz .

      - name: Upload CarsonOS root filesystem
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: carsonos-lfs-rootfs-${{ github.run_number }}
          path: output/carsonos-lfs-rootfs.tar.gz
          if-no-files-found: error

      - name: Upload CarsonOS ISO
        if: ${{ success() && (inputs.build_iso || github.event_name != 'workflow_dispatch') }}
        uses: actions/upload-artifact@v6
        with:
          name: carsonos-blfs-x86_64-iso-${{ github.run_number }}
          path: |
            output/carsonos-blfs-x86_64.iso
            output/carsonos-blfs-x86_64.iso.sha256
          if-no-files-found: error
