# CarsonOS BLFS LFS configuration
# Pinned to the current LFS 13.0-systemd stable book for the first
# implementation. Update this file deliberately when moving releases.

LFS_VERSION=13.0
LFS_FLAVOR=systemd
TARGET_ARCH=x86_64

# Core versions from LFS 13.0-systemd
BINUTILS_VERSION=2.46.0
GCC_VERSION=15.2.0
GLIBC_VERSION=2.43
LINUX_VERSION=6.18.10
BASH_VERSION=5.3
BZIP2_VERSION=1.0.8
COREUTILS_VERSION=9.10
DIFFUTILS_VERSION=3.12
FINDUTILS_VERSION=4.10.0
GAWK_VERSION=5.3.1
GREP_VERSION=3.12
GZIP_VERSION=1.14
M4_VERSION=1.4.20
MAKE_VERSION=4.4.1
PATCH_VERSION=2.8
PERL_VERSION=5.42.0
SED_VERSION=4.9
TAR_VERSION=1.35
TEXINFO_VERSION=7.2
XZ_VERSION=5.8.1

# Build locations. Override these in the environment if required.
LFS=${LFS:-/mnt/carsonos}
SOURCES=${SOURCES:-$LFS/sources}
BUILD=${BUILD:-$LFS/build}

# First release target. Do not consume the rolling LFS development book
# automatically; package changes should be reviewed and pinned manually.
BOOK_URL=https://www.linuxfromscratch.org/lfs/view/13.0-systemd/
